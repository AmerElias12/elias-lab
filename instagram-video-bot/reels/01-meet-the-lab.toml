# One Reel. Copy this file to make another; `python bot.py next` posts them in
# file-name order, one per run. Paths are relative to this file.
# See it before it goes anywhere:  python bot.py render reels/01-meet-the-lab.toml

# A line ending in \ joins the next one, so the caption can be wrapped here
# without the breaks showing up on Instagram. A blank line is a real break.
caption = """\
Meet the Elias Lab. We engineer tyrosine integrases: enzymes that write \
a whole gene into one precise place in the genome, for gene therapies that \
stay where they are put.
"""
hashtags = ["genetherapy", "molecularbiology", "genomeengineering", "labmembers", "science"]

