; Alembic configuration.
;
; There is deliberately no sqlalchemy.url here. The URL comes from the
; environment via app.config in migrations/env.py, so there is one place that
; knows how to reach the database and no chance of a connection string being
; committed to a public repository.

[alembic]
script_location = migrations
prepend_sys_path = .

; Revision files sort by filename, so the timestamp keeps them in the order
; they were written rather than in the order their random ids happen to sort.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
