<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primer Generator - Dual System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="../js/save-file.js?v=1"></script>
    <script src="../js/primer-store.js?v=4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .copy-icon { cursor: pointer; transition: all 0.2s; }
        .copy-icon:hover { transform: scale(1.2); }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- The server-design panel only. Everything else on this page runs
         with both of these absent, as it always has. -->
    <script src="../js/config.js?v=22"></script>
    <script src="../js/science-api.js?v=22"></script>

    <script type="text/babel">
        const { useState } = React;

        /* ===================================================================
           Server-side primer design.

           Everything else on this page is a browser calculation and stays
           one: the gRNA spacer primers are string surgery (spacer plus the
           two invariant tails) and the regular-primer register stores what
           you paste, with a Tm from the GC formula.

           That formula is the reason this panel exists. 64.9 + 41·(GC −
           0.675)/(len − 0.675) ignores which bases sit next to which, and
           ignores the salt and primer concentration the PCR actually runs
           at. The service computes a nearest-neighbour Tm under stated
           conditions, checks hairpins and dimers with seqfold behind it,
           proposes whole pairs with the score broken into its parts, and
           will screen them against a background sequence. None of that runs
           in a browser, so it is a request; see js/science-api.js.

           With no service configured this renders one line saying so, and
           the rest of the page is untouched.
           =============================================================== */
        function ServerPrimerDesign() {
            const API = window.ScienceAPI;

            const [svc, setSvc] = React.useState({ kind: 'checking' });
            const [template, setTemplate] = React.useState('');
            const [productLength, setProductLength] = React.useState(400);
            const [optimalTm, setOptimalTm] = React.useState(60);
            const [maxPairs, setMaxPairs] = React.useState(3);
            const [purpose, setPurpose] = React.useState('cloning');
            const [busy, setBusy] = React.useState(false);
            const [result, setResult] = React.useState(null);
            const [problem, setProblem] = React.useState(null);

            React.useEffect(() => {
                if (!API) { setSvc({ kind: 'missing' }); return; }
                API.status().then(setSvc);
            }, []);

            const design = () => {
                setBusy(true);
                setProblem(null);
                API.designPrimers({ template, productLength, optimalTm, maxPairs, purpose })
                    .then((r) => { setResult(r); })
                    .catch((err) => {
                        setProblem(API.explain(err));
                        // A 400 is bad input, not a broken page: the previous
                        // table stays so it can be compared with the message.
                        if (err && err.kind !== 'bad-request' && err.kind !== 'input') setResult(null);
                    })
                    .then(() => setBusy(false));
            };

            if (svc.kind === 'checking') return null;

            if (svc.kind === 'missing' || svc.kind === 'unconfigured' || svc.kind === 'signed-out') {
                const d = svc.kind === 'missing'
                    ? { title: 'Panel unavailable', message: 'js/science-api.js did not load, so server-side primer design is off. Everything above runs in your browser and is unaffected.', signIn: false }
                    : API.describeError({ kind: svc.kind }, {});
                return (
                    <div className="mt-8 bg-white rounded-xl shadow-lg p-6 border-l-4 border-gray-400">
                        <h2 className="text-xl font-bold text-gray-900 mb-1">Primer design on the server — {d.title.toLowerCase()}</h2>
                        <p className="text-gray-600">
                            {d.message}{' '}
                            {d.signIn && <a href="../notebook.html" className="text-blue-600 font-semibold ml-1 hover:underline">Open the notebook to sign in →</a>}
                        </p>
                    </div>
                );
            }

            return (
                <div className="mt-8 bg-white rounded-xl shadow-lg p-8 border-l-4 border-emerald-500">
                    <h2 className="text-2xl font-bold text-gray-900 mb-2">Primer Design — on the server</h2>
                    <p className="text-gray-600 mb-6">
                        Nearest-neighbour Tm under stated PCR conditions, hairpin and dimer checks, and whole
                        pairs ranked with the score broken into its parts. Nothing is stored.
                    </p>

                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-2">
                            <label className="block text-sm font-semibold text-gray-700 mb-2">Template</label>
                            <textarea
                                value={template}
                                onChange={(e) => setTemplate(e.target.value)}
                                rows={8}
                                spellCheck={false}
                                placeholder="Bases — the region the product should come from. Line breaks and numbering are fine; a GenBank or FASTA record is not (this endpoint takes sequence, not records)."
                                className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-emerald-500 outline-none transition font-mono text-xs"
                            />
                            <p className="text-xs text-gray-500 mt-1">
                                Bases only. The template is sent to the lab's own service and is not kept there.
                            </p>
                        </div>

                        <div className="space-y-4">
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2">Product length (bp)</label>
                                <input type="number" min={API.LIMITS.PRODUCT_BP[0]} max={API.LIMITS.PRODUCT_BP[1]}
                                    value={productLength}
                                    onChange={(e) => setProductLength(e.target.value)}
                                    className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-emerald-500 outline-none transition font-mono" />
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2">Target Tm (°C)</label>
                                <input type="number" step="0.5" min={API.LIMITS.TM_RANGE[0]} max={API.LIMITS.TM_RANGE[1]}
                                    value={optimalTm}
                                    onChange={(e) => setOptimalTm(e.target.value)}
                                    className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-emerald-500 outline-none transition font-mono" />
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2">Pairs to return</label>
                                <input type="number" min={API.LIMITS.PAIR_RANGE[0]} max={API.LIMITS.PAIR_RANGE[1]}
                                    value={maxPairs}
                                    onChange={(e) => setMaxPairs(e.target.value)}
                                    className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-emerald-500 outline-none transition font-mono" />
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2">Purpose</label>
                                <select value={purpose} onChange={(e) => setPurpose(e.target.value)}
                                    className="w-full px-4 py-2 border-2 border-gray-300 rounded-lg focus:border-emerald-500 outline-none transition">
                                    <option value="cloning">Cloning — amplify from a plasmid</option>
                                    <option value="qpcr">qRT-PCR — cDNA, with gDNA about</option>
                                    <option value="analytical">Analytical — genomic template</option>
                                </select>
                            </div>
                            <button onClick={design} disabled={busy}
                                className="w-full px-4 py-3 bg-emerald-600 text-white font-bold rounded-lg hover:bg-emerald-700 transition disabled:opacity-50">
                                {busy ? 'Designing…' : 'Design primer pairs'}
                            </button>
                        </div>
                    </div>

                    {problem && (
                        <div className={'mt-6 rounded-lg p-4 border-l-4 ' + (problem.kind === 'bad-request' || problem.kind === 'input' ? 'bg-amber-50 border-amber-500' : 'bg-red-50 border-red-500')}>
                            <p className="font-bold text-gray-900">{problem.title}</p>
                            <p className="text-gray-700">
                                {problem.message}{' '}
                                {problem.signIn && <a href="../notebook.html" className="text-blue-600 font-semibold ml-1 hover:underline">Open the notebook to sign in →</a>}
                            </p>
                        </div>
                    )}

                    {result && <DesignResult result={result} />}
                </div>
            );
        }

        /* The answer: what the Tm means, the pairs, and — for qPCR — the one
           decision the service cannot make for you. */
        function DesignResult({ result }) {
            const API = window.ScienceAPI;
            const pairs = (result.pairs || []).map((p, i) => API.summarizePair(p, i));
            const guidance = API.guidanceLines(result.guidance);
            const conditions = API.tmConditionsLine(result.tm_conditions);

            return (
                <div className="mt-8">
                    <div className="flex flex-wrap gap-x-6 gap-y-1 text-sm text-gray-600 mb-4">
                        <span><strong className="text-gray-900">{result.template_length}</strong> bp template</span>
                        <span><strong className="text-gray-900">{result.windows_tried}</strong> positions tried</span>
                        <span><strong className="text-gray-900">{result.pairs_found}</strong> pairs found</span>
                        {result.screen && <span>screened against {result.screen.name} ({result.screen.length_bp} bp)</span>}
                    </div>

                    {conditions && (
                        <p className="text-xs text-gray-500 mb-4">
                            Tm computed at {conditions}. Biopython's defaults describe a hybridisation
                            experiment rather than a PCR, and the difference is around ten degrees — so the
                            conditions travel with the number.
                        </p>
                    )}

                    {pairs.length === 0 && (
                        <p className="text-gray-700 font-semibold">No pair met the criteria. The notes below say why.</p>
                    )}

                    {pairs.length > 0 && (
                        <div className="overflow-x-auto">
                            <table className="w-full text-sm">
                                <thead>
                                    <tr className="text-left text-xs uppercase tracking-wide text-gray-500 border-b-2 border-gray-200">
                                        <th className="py-2 pr-3">#</th>
                                        <th className="py-2 pr-3">Primer</th>
                                        <th className="py-2 pr-3">Sequence (5'→3')</th>
                                        <th className="py-2 pr-3">Len</th>
                                        <th className="py-2 pr-3">Tm</th>
                                        <th className="py-2 pr-3">GC%</th>
                                        <th className="py-2 pr-3">Position</th>
                                        <th className="py-2 pr-3">Score</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {pairs.map((pair) => [
                                        ...pair.primers.map((primer, j) => (
                                            <tr key={`${pair.rank}-${primer.role}`} className={j === 0 ? 'border-t border-gray-200' : ''}>
                                                {j === 0 && (
                                                    <td className="py-2 pr-3 align-top font-bold text-gray-900" rowSpan={2}>{pair.rank}</td>
                                                )}
                                                <td className="py-2 pr-3 text-gray-600">{primer.role}</td>
                                                <td className="py-2 pr-3 font-mono text-xs break-all">
                                                    {primer.sequence}
                                                    <i className="fas fa-copy copy-icon text-gray-400 ml-2"
                                                       title="Copy"
                                                       onClick={() => navigator.clipboard.writeText(primer.sequence)}></i>
                                                </td>
                                                <td className="py-2 pr-3 font-mono">{primer.length}</td>
                                                <td className="py-2 pr-3 font-mono">{primer.tm}°C</td>
                                                <td className="py-2 pr-3 font-mono">{primer.gc}</td>
                                                <td className="py-2 pr-3 font-mono text-xs">{primer.position}{primer.strand === '-' ? ' (rev)' : ''}</td>
                                                {j === 0 && (
                                                    <td className="py-2 pr-3 align-top font-mono font-bold text-gray-900" rowSpan={2}>{pair.score}</td>
                                                )}
                                            </tr>
                                        )),
                                        <tr key={`${pair.rank}-detail`} className="bg-gray-50">
                                            <td></td>
                                            <td colSpan={7} className="py-2 pr-3">
                                                <div className="text-xs text-gray-600">
                                                    product {pair.productLength} bp ({pair.productSpan}) · ΔTm {pair.tmDifference} °C ·
                                                    hetero-dimer {pair.heteroDimer}
                                                    {pair.screened
                                                        ? ` · ${pair.spuriousAmplicons} unintended product${pair.spuriousAmplicons === 1 ? '' : 's'} in the background`
                                                        : ' · not screened against any background'}
                                                </div>
                                                <div className="text-xs text-gray-600 mt-1">
                                                    score {pair.score} ={' '}
                                                    {pair.penalties.length === 0
                                                        ? 'nothing penalised'
                                                        : pair.penalties.map((p) => `${p.label} ${p.value}`).join(' + ')}
                                                </div>
                                                {pair.warnings.length > 0 && (
                                                    <ul className="mt-2 space-y-1">
                                                        {pair.warnings.map((w, k) => (
                                                            <li key={k} className="text-xs text-amber-700">⚠ {w}</li>
                                                        ))}
                                                    </ul>
                                                )}
                                            </td>
                                        </tr>,
                                    ])}
                                </tbody>
                            </table>
                        </div>
                    )}

                    {guidance.length > 0 && (
                        <div className="mt-6 bg-blue-50 border-l-4 border-blue-500 rounded-lg p-5">
                            <h3 className="font-bold text-gray-900 mb-2">{guidance[0]}</h3>
                            <ul className="space-y-1">
                                {guidance.slice(1).map((line, i) => (
                                    <li key={i} className="text-sm text-gray-700">{line}</li>
                                ))}
                            </ul>
                        </div>
                    )}

                    {(result.notes || []).length > 0 && (
                        <ul className="mt-6 space-y-2">
                            {result.notes.map((note, i) => (
                                <li key={i} className="text-sm text-gray-600 border-l-2 border-gray-300 pl-3">{note}</li>
                            ))}
                        </ul>
                    )}
                </div>
            );
        }

        function PrimerGenerator() {
            // ===== gRNA CLONING PRIMERS (PRg) =====
            const [grnaSpacetr, setGrnaSpacetr] = useState('');
            const [grnaPrimers, setGrnaPrimers] = useState([]);
            const [grnaDescription, setGrnaDescription] = useState('');
            const [grnaPrimerCounter, setGrnaPrimerCounter] = useState(1);
            const [grnaFreezer, setGrnaFreezer] = useState('AE_Freezer 1 (-20C)');
            const [grnaShelf, setGrnaShelf] = useState('A');
            const [grnaBox, setGrnaBox] = useState('1');
            
            // ===== REGULAR PRIMERS (PR) =====
            const [regPrimerSeq, setRegPrimerSeq] = useState('');
            const [regPrimers, setRegPrimers] = useState([]);
            const [regPrimerDesc, setRegPrimerDesc] = useState('');
            const [regPrimerOrientation, setRegPrimerOrientation] = useState('Frw');
            const [regPrimerCounter, setRegPrimerCounter] = useState(1);
            const [regFreezer, setRegFreezer] = useState('AE_Freezer 1 (-20C)');
            const [regShelf, setRegShelf] = useState('A');
            const [regBox, setRegBox] = useState('1');
            const [regPrimerVendor, setRegPrimerVendor] = useState('IDT');
            const [regPrimerStatus, setRegPrimerStatus] = useState('Designed');
            const [shared, setShared] = useState(false);
            const [storeNote, setStoreNote] = useState('');
            const [saveError, setSaveError] = useState('');
            const [showClearModal, setShowClearModal] = useState(false);
            const [clearPasscode, setClearPasscode] = useState('');
            const CLEAR_PASSCODE = 'DELETE123'; // Set your secure passcode here

            /* Who may change the list: the PI, and members the PI has allowed
               (js/primer-store.js). Read again whenever the page comes back
               into view, so an answer given meanwhile shows up. */
            const [access, setAccess] = useState({ can: false, state: 'none', admin: false, pending: 0 });
            const [asking, setAsking] = useState(false);
            const [editing, setEditing] = useState(null);   // { kind: 'reg' | 'grna', draft }
            const [copied, setCopied] = useState('');
            React.useEffect(() => {
                const look = () => setAccess(PrimerStore.access());
                window.primerAccessChanged = look;
                window.addEventListener('focus', look);
                document.addEventListener('visibilitychange', look);
                return () => { window.removeEventListener('focus', look); document.removeEventListener('visibilitychange', look); };
            }, []);

            const BOX_CAPACITY = 100;

            /* The primers live in the lab's shared inventory, so a primer
               entered here is a primer everyone sees. js/primer-store.js does
               the talking; opened on its own, away from the notebook, it falls
               back to this browser as it always did.

               `loaded` guards the save effects below: they run once on mount
               too, and without it an empty initial state would be written over
               a list that had not arrived yet. */
            const [loaded, setLoaded] = useState(false);
            React.useEffect(() => {
                let dead = false;
                PrimerStore.load().then(state => {
                    if (dead) return;
                    setGrnaPrimers(state.grna);
                    setRegPrimers(state.regular);
                    setGrnaPrimerCounter(state.grnaCounter);
                    setRegPrimerCounter(state.regCounter);
                    setShared(state.shared);
                    setStoreNote(state.shared
                        ? (state.moved ? 'Shared with the lab · ' + state.moved + ' primer' + (state.moved === 1 ? '' : 's') + ' moved up from this browser' : 'Shared with the lab')
                        : 'This browser only — open the Primers page in the notebook to share these');
                    setAccess(PrimerStore.access());
                    setLoaded(true);
                }, () => { setAccess(PrimerStore.access()); setLoaded(true); });
                return () => { dead = true; };
            }, []);

            /* A save that fails has to say so. These ran as fire-and-forget:
               save() is async, so a rejected write — the shared store refusing
               the row, the network gone — went nowhere anybody would see it.
               The primer stayed on screen looking saved, and the next refresh
               was the first anyone heard of it. */
            const keep = (kind, list) => {
                if (!loaded) return;
                PrimerStore.save(kind, list).then(
                    () => setSaveError(''),
                    (err) => setSaveError((err && err.message) || String(err)));
            };
            React.useEffect(() => { keep('grna', grnaPrimers); }, [grnaPrimers, loaded]);
            React.useEffect(() => { keep('regular', regPrimers); }, [regPrimers, loaded]);

            /* The lists as they are shown and exported: in number order. The
               shared store hands rows back in whatever order it holds them,
               and an import can bring numbers in out of sequence. */
            const byNumber = (list, key) => [...list].sort((x, y) => (+x[key] || 0) - (+y[key] || 0));
            const regSorted = byNumber(regPrimers, 'number');
            const grnaSorted = byNumber(grnaPrimers, 'forwardNumber');

            // Tm calculation
            const calculateTm = (sequence) => {
                if (!sequence || sequence.length < 14) return 'N/A';
                const seq = sequence.toUpperCase();
                const gcCount = (seq.match(/G/g) || []).length + (seq.match(/C/g) || []).length;
                const gcPercent = gcCount / seq.length;
                const tm = 64.9 + 41 * (gcPercent - 0.675) / (seq.length - 0.675);
                return tm.toFixed(1);
            };

            // Reverse complement
            const getReverseComplement = (seq) => {
                const complement = { 'A': 'T', 'T': 'A', 'G': 'C', 'C': 'G', 'a': 't', 't': 'a', 'g': 'c', 'c': 'g' };
                return seq.split('').reverse().map(base => complement[base] || base).join('');
            };

            const isValidDNASequence = (seq) => /^[ATGCatgc]{20}$/.test(seq);

            // ===== gRNA CLONING FUNCTIONS =====
            const generateGrnaPrimer = () => {
                if (!isValidDNASequence(grnaSpacetr)) {
                    alert('Please enter a valid 20 bp DNA sequence (only ATGC)');
                    return;
                }

                const forwardInvariant = 'GTTTCAGAGCTATGCTGGAAACAG';
                const reverseInvariant = 'ggtgtttcgtcctttccac';
                const forwardPrimer = grnaSpacetr.toUpperCase() + forwardInvariant;
                const reverseComplement = getReverseComplement(grnaSpacetr.toUpperCase());
                const reversePrimer = reverseComplement + reverseInvariant;

                const forwardNumber = grnaPrimerCounter;
                const reverseNumber = grnaPrimerCounter + 1;

                const newPrimer = {
                    id: PrimerStore.newId(),
                    forwardNumber,
                    reverseNumber,
                    forwardName: `PRg${forwardNumber}_Frw`,
                    reverseName: `PRg${reverseNumber}_Rev`,
                    spacerSeq: grnaSpacetr.toUpperCase(),
                    forwardPrimer,
                    reversePrimer,
                    forwardLength: forwardPrimer.length,
                    reverseLength: reversePrimer.length,
                    description: grnaDescription,
                    freezer: grnaFreezer,
                    shelf: grnaShelf,
                    box: grnaBox
                };

                setGrnaPrimers([...grnaPrimers, newPrimer]);
                setGrnaPrimerCounter(grnaPrimerCounter + 2);
                setGrnaSpacetr('');
                setGrnaDescription('');
            };

            const getGrnaAvailableBox = () => {
                const boxCounts = {};
                grnaPrimers.forEach(p => {
                    const key = `${p.freezer}_${p.shelf}_${p.box}`;
                    boxCounts[key] = (boxCounts[key] || 0) + 2;
                });
                let box = 1;
                while ((boxCounts[`${grnaFreezer}_${grnaShelf}_${box}`] || 0) >= BOX_CAPACITY) box++;
                return box;
            };

            const getGrnaBoxes = () => {
                const boxCounts = {};
                grnaPrimers.forEach(p => {
                    const key = `${p.freezer}_${p.shelf}_${p.box}`;
                    boxCounts[key] = (boxCounts[key] || 0) + 2;
                });
                const current = getGrnaAvailableBox();
                const boxes = [];
                for (let i = 1; i <= current; i++) {
                    const key = `${grnaFreezer}_${grnaShelf}_${i}`;
                    const count = boxCounts[key] || 0;
                    boxes.push({ number: i, count, isFull: count >= BOX_CAPACITY });
                }
                return boxes;
            };

            // ===== EDIT, COPY, DELETE =====
            const askToEdit = async () => {
                const note = window.prompt('Asking the PI for permission to edit, copy and delete primers.\n\nAnything to add? (optional)', '');
                if (note === null) return;
                setAsking(true);
                try { await PrimerStore.requestAccess(note); setAccess(PrimerStore.access()); }
                catch (e) { alert('Could not send the request: ' + ((e && e.message) || e)); }
                setAsking(false);
            };
            const allowed = () => {
                if (access.can) return true;
                alert('Editing, copying and deleting primers is for the PI, and for members the PI has allowed. Use “Ask to edit” at the top of the page.');
                return false;
            };
            const copyText = (text, key) => {
                const done = () => { setCopied(key); setTimeout(() => setCopied(c => c === key ? '' : c), 1500); };
                if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => window.prompt('Copy the sequence:', text));
                else window.prompt('Copy the sequence:', text);
            };
            const cleanSeq = (x) => String(x || '').replace(/[^A-Za-z]/g, '').toUpperCase();
            const okSeq = (x) => /^[ACGTRYSWKMBDHVN]+$/.test(x);

            const startEditReg = (p) => { if (allowed()) setEditing({ kind: 'reg', draft: { ...p } }); };
            const startEditGrna = (p) => { if (allowed()) setEditing({ kind: 'grna', draft: { ...p } }); };
            const setDraft = (field, value) => setEditing(e => ({ ...e, draft: { ...e.draft, [field]: value } }));
            const saveEdit = () => {
                const d = editing.draft;
                if (editing.kind === 'reg') {
                    const seq = cleanSeq(d.sequence);
                    if (!seq || !okSeq(seq)) { alert('The sequence can only hold bases (A, C, G, T or IUPAC codes).'); return; }
                    if (!String(d.name || '').trim()) { alert('The primer needs a name.'); return; }
                    const rec = { ...d, name: d.name.trim(), sequence: seq, length: seq.length, tm: calculateTm(seq) };
                    setRegPrimers(regPrimers.map(x => x.id === rec.id ? rec : x));
                } else {
                    const f = cleanSeq(d.forwardPrimer), r = cleanSeq(d.reversePrimer);
                    if (!okSeq(f) || !okSeq(r)) { alert('Both primers need a sequence made of bases only.'); return; }
                    const rec = { ...d, forwardPrimer: f, reversePrimer: r, forwardLength: f.length, reverseLength: r.length,
                        spacerSeq: cleanSeq(d.spacerSeq) };
                    setGrnaPrimers(grnaPrimers.map(x => x.id === rec.id ? rec : x));
                }
                setEditing(null);
            };
            /* A copy is a new primer with the next number, the same bases and
               the same notes, and "copy" on the end of its name so the two are
               told apart at a glance. It starts again as Designed: the copy
               has not been ordered. */
            const copyReg = (p) => {
                if (!allowed()) return;
                const n = regPrimerCounter;
                const rest = String(p.name || '').replace(/^PR\d+_?/, '');
                const rec = { ...p, id: PrimerStore.newId(), number: n, name: 'PR' + n + (rest ? '_' + rest : '') + ' copy', status: 'Designed' };
                setRegPrimers([...regPrimers, rec]);
                setRegPrimerCounter(n + 1);
            };
            const copyGrna = (p) => {
                if (!allowed()) return;
                const n = grnaPrimerCounter;
                const rec = { ...p, id: PrimerStore.newId(), forwardNumber: n, reverseNumber: n + 1,
                    forwardName: 'PRg' + n + '_Frw', reverseName: 'PRg' + (n + 1) + '_Rev',
                    description: (p.description ? p.description + ' ' : '') + '(copy of ' + p.forwardName + ')' };
                setGrnaPrimers([...grnaPrimers, rec]);
                setGrnaPrimerCounter(n + 2);
            };
            const deleteReg = (p) => {
                if (!allowed()) return;
                if (!window.confirm('Delete ' + p.name + '?' + (shared ? '\n\nThe list is shared, so it goes for everyone in the lab.' : ''))) return;
                setRegPrimers(regPrimers.filter(x => x.id !== p.id));
            };
            const deleteGrna = (p) => {
                if (!allowed()) return;
                if (!window.confirm('Delete the pair ' + p.forwardName + ' and ' + p.reverseName + '? The two are one record, so both go.' +
                    (shared ? '\n\nThe list is shared, so it goes for everyone in the lab.' : ''))) return;
                setGrnaPrimers(grnaPrimers.filter(x => x.id !== p.id));
            };
            const RowActions = ({ seq, copyKey, onEdit, onCopy, onDelete }) => (
                <div className="flex gap-1 justify-end whitespace-nowrap">
                    <button title="Copy the sequence" onClick={() => copyText(seq, copyKey)}
                        className="px-2 py-1 rounded border border-gray-200 text-gray-600 hover:bg-gray-100">
                        <i className={'fas ' + (copied === copyKey ? 'fa-check text-green-600' : 'fa-clipboard')}></i>
                    </button>
                    {access.can && onEdit && <button title="Edit" onClick={onEdit} className="px-2 py-1 rounded border border-gray-200 text-gray-600 hover:bg-gray-100"><i className="fas fa-pen"></i></button>}
                    {access.can && onCopy && <button title="Make a copy with the next number" onClick={onCopy} className="px-2 py-1 rounded border border-gray-200 text-gray-600 hover:bg-gray-100"><i className="fas fa-clone"></i></button>}
                    {access.can && onDelete && <button title="Delete" onClick={onDelete} className="px-2 py-1 rounded border border-red-200 text-red-600 hover:bg-red-50"><i className="fas fa-trash"></i></button>}
                </div>
            );

            // ===== REGULAR PRIMER FUNCTIONS =====
            const generateRegPrimer = () => {
                if (!regPrimerSeq.trim()) {
                    alert('Please enter a primer sequence');
                    return;
                }
                if (!regPrimerDesc.trim()) {
                    alert('Description is required');
                    return;
                }

                const primerNumber = regPrimerCounter;
                const descSnippet = regPrimerDesc.substring(0, 20);
                const primerName = `PR${primerNumber}_${descSnippet}`;

                const newPrimer = {
                    id: PrimerStore.newId(),
                    number: primerNumber,
                    name: primerName,
                    sequence: regPrimerSeq.toUpperCase(),
                    length: regPrimerSeq.length,
                    tm: calculateTm(regPrimerSeq),
                    description: regPrimerDesc,
                    orientation: regPrimerOrientation,
                    freezer: regFreezer,
                    shelf: regShelf,
                    box: regBox,
                    vendor: regPrimerVendor,
                    status: regPrimerStatus
                };

                setRegPrimers([...regPrimers, newPrimer]);
                setRegPrimerCounter(regPrimerCounter + 1);
                setRegPrimerSeq('');
                setRegPrimerDesc('');
            };

            const getRegAvailableBox = () => {
                const boxCounts = {};
                regPrimers.forEach(p => {
                    const key = `${p.freezer}_${p.shelf}_${p.box}`;
                    boxCounts[key] = (boxCounts[key] || 0) + 1;
                });
                let box = 1;
                while ((boxCounts[`${regFreezer}_${regShelf}_${box}`] || 0) >= BOX_CAPACITY) box++;
                return box;
            };

            const getRegBoxes = () => {
                const boxCounts = {};
                regPrimers.forEach(p => {
                    const key = `${p.freezer}_${p.shelf}_${p.box}`;
                    boxCounts[key] = (boxCounts[key] || 0) + 1;
                });
                const current = getRegAvailableBox();
                const boxes = [];
                for (let i = 1; i <= current; i++) {
                    const key = `${regFreezer}_${regShelf}_${i}`;
                    const count = boxCounts[key] || 0;
                    boxes.push({ number: i, count, isFull: count >= BOX_CAPACITY });
                }
                return boxes;
            };

            // Export functions
            // Every cell is quoted and embedded quotes are doubled, per RFC 4180 —
            // without this a description containing " or , silently breaks the row.
            // A leading = + - or @ is prefixed so Excel treats it as text, not a formula.
            const csvCell = (value) => {
                let v = (value === null || value === undefined) ? '' : String(value);
                if (/^[=+\-@]/.test(v)) v = "'" + v;
                return '"' + v.replace(/"/g, '""') + '"';
            };
            const downloadCsv = (rows, filename) => {
                const csv = rows.map(r => r.map(csvCell).join(',')).join('\r\n');
                // BOM so Excel reads the UTF-8 in °C and 5'→3' instead of mojibake.
                // js/save-file.js does the handing over: a download in a window
                // of its own, a Save dialog where downloads are not allowed.
                LabSave.save(filename, '\ufeff' + csv, 'text/csv;charset=utf-8');
            };

            const exportGrna = () => {
                if (!grnaPrimers.length) { alert('No gRNA cloning primers saved yet.'); return; }
                // Header on row 1: a title line above it stops Excel and pandas
                // from reading the columns. The kind of primer is in the filename.
                const rows = [['No', 'Name', 'Sequence', 'Length', 'Tm', 'Freezer', 'Shelf', 'Box', 'Description']];
                grnaSorted.forEach(p => {
                    rows.push([p.forwardNumber, p.forwardName, p.forwardPrimer, p.forwardLength, calculateTm(p.forwardPrimer), p.freezer, p.shelf, p.box, p.description]);
                    rows.push([p.reverseNumber, p.reverseName, p.reversePrimer, p.reverseLength, calculateTm(p.reversePrimer), p.freezer, p.shelf, p.box, p.description]);
                });
                downloadCsv(rows, 'PRg_gRNA_Cloning_Primers.csv');
            };

            const exportReg = () => {
                if (!regPrimers.length) { alert('No regular primers saved yet.'); return; }
                const rows = [['No', 'Name', 'Sequence', 'Length', 'Tm', 'Orientation', 'Freezer', 'Shelf', 'Box', 'Vendor', 'Status', 'Description']];
                regSorted.forEach(p => {
                    rows.push([p.number, p.name, p.sequence, p.length, p.tm, p.orientation, p.freezer, p.shelf, p.box, p.vendor, p.status, p.description]);
                });
                downloadCsv(rows, 'PR_Regular_Primers.csv');
            };

            const clearAll = () => {
                if (!allowed()) return;
                setShowClearModal(true);
                setClearPasscode('');
            };

            // Only meaningful while standalone; shared primers are removed by the
            // save effects, which see the lists go empty.
            const forgetLocalCopies = () => {
                ['grnaPrimers', 'grnaPrimerCounter', 'regPrimers', 'regPrimerCounter']
                    .forEach(k => { try { localStorage.removeItem(k); } catch (e) {} });
            };

            const confirmClearAll = () => {
                if (clearPasscode.toUpperCase() === CLEAR_PASSCODE) {
                    setGrnaPrimers([]);
                    setGrnaPrimerCounter(1);
                    setRegPrimers([]);
                    setRegPrimerCounter(1);
                    forgetLocalCopies();
                    setShowClearModal(false);
                    setClearPasscode('');
                    alert('✓ All data has been deleted successfully');
                } else {
                    alert('✗ Incorrect passcode. Please try again.');
                    setClearPasscode('');
                }
            };

            // ===== BULK UPLOAD FUNCTIONS =====
            /* Both templates go out the way the exports do, as a file made in
               the page. They used to be a data: address handed to a link,
               which not every browser will treat as a download — least of
               all from inside a frame, and this page is shown in one on the
               notebook's Primers page. There the button did nothing. */
            const downloadGrnaTemplate = () => {
                downloadCsv([
                    ['20bp Spacer', 'Description', 'Freezer', 'Shelf', 'Box'],
                    ['ATCGATCGATCGATCGATCG', 'Example gRNA 1', 'AE_Freezer 1 (-20C)', 'A', '1'],
                    ['GCTAGCTAGCTAGCTAGCTA', 'Example gRNA 2', 'AE_Freezer 1 (-20C)', 'A', '1']
                ], 'gRNA_Primers_Template.csv');
            };

            const downloadRegTemplate = () => {
                downloadCsv([
                    ['Sequence', 'Orientation', 'Description', 'Vendor', 'Status', 'Freezer', 'Shelf', 'Box'],
                    ['ATCGATCGATCGATCGATCG', 'Frw', 'Example primer 1', 'IDT', 'Designed', 'AE_Freezer 1 (-20C)', 'A', '1'],
                    ['GCTAGCTAGCTAGCTAGCTA', 'Rev', 'Example primer 2', 'GeneScript', 'Ordered', 'AE_Freezer 1 (-20C)', 'A', '1']
                ], 'Regular_Primers_Template.csv');
            };

            const uploadGrnaFile = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        // Parse CSV
                        const csv = e.target.result;
                        const lines = csv.split('\n').filter(line => line.trim());
                        const headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim());
                        
                        let addedCount = 0;
                        const newPrimers = [...grnaPrimers];
                        let counter = grnaPrimerCounter;

                        for (let i = 1; i < lines.length; i++) {
                            const values = lines[i].split(',').map(v => v.replace(/"/g, '').trim());
                            if (!values[0]) continue; // Skip empty rows

                            const spacer = values[0];
                            if (!isValidDNASequence(spacer)) continue;

                            const description = values[1] || '';
                            const freezer = values[2] || 'AE_Freezer 1 (-20C)';
                            const shelf = values[3] || 'A';
                            const box = values[4] || '1';

                            const forwardInvariant = 'GTTTCAGAGCTATGCTGGAAACAG';
                            const reverseInvariant = 'ggtgtttcgtcctttccac';
                            const forwardPrimer = spacer.toUpperCase() + forwardInvariant;
                            const reverseComplement = getReverseComplement(spacer.toUpperCase());
                            const reversePrimer = reverseComplement + reverseInvariant;

                            const forwardNumber = counter;
                            const reverseNumber = counter + 1;

                            newPrimers.push({
                                id: PrimerStore.newId(),
                                forwardNumber,
                                reverseNumber,
                                forwardName: `PRg${forwardNumber}_Frw`,
                                reverseName: `PRg${reverseNumber}_Rev`,
                                spacerSeq: spacer.toUpperCase(),
                                forwardPrimer,
                                reversePrimer,
                                forwardLength: forwardPrimer.length,
                                reverseLength: reversePrimer.length,
                                description,
                                freezer,
                                shelf,
                                box
                            });

                            counter += 2;
                            addedCount++;
                        }

                        if (addedCount > 0) {
                            setGrnaPrimers(newPrimers);
                            setGrnaPrimerCounter(counter);
                            alert(`✓ Successfully imported ${addedCount} gRNA primer pairs`);
                        } else {
                            alert('✗ No valid primers found in file');
                        }
                        event.target.value = '';
                    } catch (error) {
                        alert('✗ Error reading file: ' + error.message);
                    }
                };
                reader.readAsText(file);
            };

            const uploadRegFile = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        // Parse CSV
                        const csv = e.target.result;
                        const lines = csv.split('\n').filter(line => line.trim());
                        const headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim());
                        
                        let addedCount = 0;
                        const newPrimers = [...regPrimers];
                        let counter = regPrimerCounter;

                        for (let i = 1; i < lines.length; i++) {
                            const values = lines[i].split(',').map(v => v.replace(/"/g, '').trim());
                            if (!values[0] || !values[2]) continue; // Skip empty rows or rows without sequence/description

                            const sequence = values[0].toUpperCase();
                            const orientation = values[1] || 'Frw';
                            const description = values[2];
                            const vendor = values[3] || 'IDT';
                            const status = values[4] || 'Designed';
                            const freezer = values[5] || 'AE_Freezer 1 (-20C)';
                            const shelf = values[6] || 'A';
                            const box = values[7] || '1';

                            const descSnippet = description.substring(0, 20);
                            const primerName = `PR${counter}_${descSnippet}`;

                            newPrimers.push({
                                id: PrimerStore.newId(),
                                number: counter,
                                name: primerName,
                                sequence,
                                length: sequence.length,
                                tm: calculateTm(sequence),
                                description,
                                orientation,
                                freezer,
                                shelf,
                                box,
                                vendor,
                                status
                            });

                            counter++;
                            addedCount++;
                        }

                        if (addedCount > 0) {
                            setRegPrimers(newPrimers);
                            setRegPrimerCounter(counter);
                            alert(`✓ Successfully imported ${addedCount} regular primers`);
                        } else {
                            alert('✗ No valid primers found in file');
                        }
                        event.target.value = '';
                    } catch (error) {
                        alert('✗ Error reading file: ' + error.message);
                    }
                };
                reader.readAsText(file);
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-50 to-blue-50 p-8">
                    <div className="max-w-7xl mx-auto">
                        {/* Header */}
                        <div className="mb-8">
                            <h1 className="text-4xl font-bold text-gray-900 mb-2">Primer Generator - Dual System</h1>
                            <p className="text-lg text-gray-600">Separate documentation for gRNA cloning (PRg) and regular primers (PR)</p>
                            {(saveError || storeNote) && (
                                <p className={'mt-2 inline-block rounded-full px-3 py-1 text-sm font-semibold ' +
                                    (saveError ? 'bg-red-100 text-red-800'
                                        : shared ? 'bg-emerald-100 text-emerald-800'
                                        : 'bg-amber-100 text-amber-800')}>
                                    {saveError
                                        ? '✗ Not saved — ' + saveError + '. Export to CSV before you close this page.'
                                        : (shared ? '✓ ' : '⚠ ') + storeNote}
                                </p>
                            )}
                        </div>

                        {/* Who may change the list */}
                        {shared && (
                            <div className={'mb-6 rounded-lg px-4 py-3 text-sm flex items-center gap-3 flex-wrap ' +
                                (access.can ? 'bg-emerald-50 text-emerald-900' : 'bg-slate-100 text-slate-700')}>
                                {access.admin ? (
                                    <span><i className="fas fa-user-shield"></i> You can edit, copy and delete primers.
                                        {access.pending > 0 && <strong> {access.pending} member{access.pending === 1 ? ' is' : 's are'} asking to as well — answer in User Management.</strong>}</span>
                                ) : access.can ? (
                                    <span><i className="fas fa-check"></i> The PI has allowed you to edit, copy and delete primers.</span>
                                ) : access.state === 'pending' ? (
                                    <span><i className="fas fa-hourglass-half"></i> You asked to edit primers. Waiting for the PI to answer.</span>
                                ) : (
                                    <>
                                        <span><i className="fas fa-lock"></i> Anyone can add primers. Editing, copying and deleting them is for the PI{access.state === 'declined' ? ' — your last request was declined' : ''}.</span>
                                        <button onClick={askToEdit} disabled={asking}
                                            className="px-3 py-1 rounded bg-indigo-600 text-white font-semibold hover:bg-indigo-700 disabled:opacity-50">
                                            {asking ? 'Sending…' : (access.state === 'declined' ? 'Ask again' : 'Ask to edit')}
                                        </button>
                                    </>
                                )}
                            </div>
                        )}

                        {/* Data Management */}
                        <div className="mb-8 bg-gradient-to-r from-blue-50 to-indigo-50 border-l-4 border-indigo-500 rounded-lg p-6 shadow">
                            <div className="flex items-center justify-between flex-wrap gap-4">
                                <div>
                                    <h3 className="text-lg font-bold text-gray-900 mb-2">💾 Saved Primers</h3>
                                    <div className="flex gap-8">
                                        <div>
                                            <p className="text-sm text-gray-600">gRNA Cloning (PRg)</p>
                                            <p className="text-2xl font-bold text-blue-600">{grnaPrimers.length * 2}</p>
                                        </div>
                                        <div>
                                            <p className="text-sm text-gray-600">Regular (PR)</p>
                                            <p className="text-2xl font-bold text-purple-600">{regPrimers.length}</p>
                                        </div>
                                        <div>
                                            <p className="text-sm text-gray-600">Total Vials</p>
                                            <p className="text-2xl font-bold text-indigo-600">{(grnaPrimers.length * 2) + regPrimers.length}</p>
                                        </div>
                                    </div>
                                </div>
                                {access.can && <button onClick={clearAll} className="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition flex items-center gap-2 font-semibold">
                                    <i className="fas fa-trash"></i> Clear All
                                </button>}
                            </div>
                        </div>

                        {/* Two Column Layout */}
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                            {/* ===== gRNA CLONING SECTION ===== */}
                            <div className="space-y-6">
                                <div className="bg-white rounded-xl shadow-lg p-8 border-l-4 border-blue-500">
                                    <h2 className="text-2xl font-bold text-gray-900 mb-2">gRNA Cloning Primers</h2>
                                    <p className="text-gray-600 mb-6">Design Gibson cloning primers (PRg)</p>

                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">20 bp Spacer Sequence</label>
                                            <input
                                                type="text"
                                                value={grnaSpacetr}
                                                onChange={(e) => setGrnaSpacetr(e.target.value.toUpperCase())}
                                                placeholder="Enter 20 bp sequence"
                                                maxLength="20"
                                                className="w-full px-4 py-3 font-mono text-lg border-2 border-gray-300 rounded-lg focus:border-blue-500 outline-none transition"
                                            />
                                            <p className="text-xs text-gray-500 mt-2">{grnaSpacetr.length}/20 bp</p>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">Description (Optional)</label>
                                            <textarea
                                                value={grnaDescription}
                                                onChange={(e) => setGrnaDescription(e.target.value)}
                                                placeholder="e.g., Target: BRCA1"
                                                rows="3"
                                                className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 outline-none transition resize-none"
                                            />
                                        </div>

                                        <div className="bg-blue-50 p-4 rounded-lg border border-blue-200">
                                            <h4 className="font-semibold text-gray-900 mb-3">Storage (2 vials)</h4>
                                            <div className="grid grid-cols-3 gap-2">
                                                <select value={grnaFreezer} onChange={(e) => setGrnaFreezer(e.target.value)} className="px-2 py-2 text-sm border rounded">
                                                    <option>AE_Freezer 1 (-20C)</option>
                                                    <option>AE_Freezer 2 (-20C)</option>
                                                </select>
                                                <select value={grnaShelf} onChange={(e) => setGrnaShelf(e.target.value)} className="px-2 py-2 text-sm border rounded">
                                                    {['A', 'B', 'C', 'D', 'E', 'F'].map(s => <option key={s} value={s}>{s}</option>)}
                                                </select>
                                                <select value={grnaBox} onChange={(e) => setGrnaBox(e.target.value)} className="px-2 py-2 text-sm border rounded">
                                                    {getGrnaBoxes().map(b => <option key={b.number} value={b.number}>Box {b.number} ({b.count}/100)</option>)}
                                                </select>
                                            </div>
                                        </div>

                                        <button
                                            onClick={generateGrnaPrimer}
                                            disabled={grnaSpacetr.length !== 20 || !isValidDNASequence(grnaSpacetr)}
                                            className="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 disabled:opacity-50 transition"
                                        >
                                            <i className="fas fa-plus"></i> Generate gRNA Primers
                                        </button>

                                        {/* Bulk Upload Section */}
                                        <div className="border-t-2 border-gray-200 pt-4 mt-4">
                                            <h4 className="text-sm font-bold text-gray-900 mb-3">📊 Bulk Import</h4>
                                            <div className="space-y-2">
                                                <button
                                                    onClick={downloadGrnaTemplate}
                                                    className="w-full px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition text-sm font-semibold flex items-center justify-center gap-2"
                                                >
                                                    <i className="fas fa-download"></i> Download Template
                                                </button>
                                                <label className="w-full">
                                                    <div className="px-4 py-2 bg-blue-100 text-blue-700 rounded-lg hover:bg-blue-200 transition text-sm font-semibold flex items-center justify-center gap-2 cursor-pointer">
                                                        <i className="fas fa-upload"></i> Upload Filled Template
                                                    </div>
                                                    <input
                                                        type="file"
                                                        accept=".csv"
                                                        onChange={uploadGrnaFile}
                                                        className="hidden"
                                                    />
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* gRNA Table */}
                                {grnaPrimers.length > 0 && (
                                    <div className="bg-white rounded-xl shadow-lg p-8">
                                        <div className="flex justify-between items-center mb-4">
                                            <h3 className="text-xl font-bold text-gray-900">gRNA Primers (PRg)</h3>
                                            <button onClick={exportGrna} className="px-3 py-2 bg-green-600 text-white rounded text-sm hover:bg-green-700">
                                                <i className="fas fa-download"></i> Export PRg
                                            </button>
                                        </div>
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-xs">
                                                <thead>
                                                    <tr className="border-b">
                                                        <th className="text-left py-2">No</th>
                                                        <th className="text-left py-2">Name</th>
                                                        <th className="text-left py-2">Sequence</th>
                                                        <th className="text-center py-2">Length</th>
                                                        <th className="text-center py-2">Tm</th>
                                                        <th className="text-center py-2">Box</th>
                                                        <th className="text-right py-2">Actions</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {grnaSorted.map(p => (
                                                        <React.Fragment key={p.id}>
                                                            <tr className="border-b hover:bg-blue-50">
                                                                <td className="py-2">{p.forwardNumber}</td>
                                                                <td className="py-2 font-bold text-blue-600">{p.forwardName}</td>
                                                                <td className="py-2 font-mono text-xs truncate">{p.forwardPrimer}</td>
                                                                <td className="py-2 text-center">{p.forwardLength}</td>
                                                                <td className="py-2 text-center">{calculateTm(p.forwardPrimer)}</td>
                                                                <td className="py-2 text-center">{p.box}</td>
                                                                <td className="py-2" rowSpan={2}>
                                                                    <RowActions seq={p.forwardPrimer} copyKey={p.id + 'f'}
                                                                        onEdit={() => startEditGrna(p)} onCopy={() => copyGrna(p)} onDelete={() => deleteGrna(p)} />
                                                                    <div className="mt-1"><RowActions seq={p.reversePrimer} copyKey={p.id + 'r'} /></div>
                                                                </td>
                                                            </tr>
                                                            <tr className="border-b hover:bg-red-50">
                                                                <td className="py-2">{p.reverseNumber}</td>
                                                                <td className="py-2 font-bold text-red-600">{p.reverseName}</td>
                                                                <td className="py-2 font-mono text-xs truncate">{p.reversePrimer}</td>
                                                                <td className="py-2 text-center">{p.reverseLength}</td>
                                                                <td className="py-2 text-center">{calculateTm(p.reversePrimer)}</td>
                                                                <td className="py-2 text-center">{p.box}</td>
                                                            </tr>
                                                        </React.Fragment>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* ===== REGULAR PRIMERS SECTION ===== */}
                            <div className="space-y-6">
                                <div className="bg-white rounded-xl shadow-lg p-8 border-l-4 border-purple-500">
                                    <h2 className="text-2xl font-bold text-gray-900 mb-2">Regular Primers</h2>
                                    <p className="text-gray-600 mb-6">Document other primers (PR)</p>

                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">Primer Sequence</label>
                                            <input
                                                type="text"
                                                value={regPrimerSeq}
                                                onChange={(e) => setRegPrimerSeq(e.target.value.toUpperCase())}
                                                placeholder="Enter primer sequence"
                                                className="w-full px-4 py-3 font-mono border-2 border-gray-300 rounded-lg focus:border-purple-500 outline-none transition"
                                            />
                                            <p className="text-xs text-gray-500 mt-2">{regPrimerSeq.length} bp</p>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">Orientation</label>
                                            <select value={regPrimerOrientation} onChange={(e) => setRegPrimerOrientation(e.target.value)} className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-purple-500 outline-none">
                                                <option value="Frw">Forward (Frw)</option>
                                                <option value="Rev">Reverse (Rev)</option>
                                            </select>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">Description * (Required)</label>
                                            <textarea
                                                value={regPrimerDesc}
                                                onChange={(e) => setRegPrimerDesc(e.target.value)}
                                                placeholder="e.g., BRCA1 screening"
                                                rows="3"
                                                className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-purple-500 outline-none transition resize-none"
                                            />
                                        </div>

                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="block text-xs font-semibold text-gray-700 mb-2">Vendor</label>
                                                <select value={regPrimerVendor} onChange={(e) => setRegPrimerVendor(e.target.value)} className="w-full px-3 py-2 text-sm border rounded">
                                                    <option>IDT</option>
                                                    <option>GeneScript</option>
                                                    <option>HyLabs</option>
                                                    <option>TwistBio</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-gray-700 mb-2">Status</label>
                                                <select value={regPrimerStatus} onChange={(e) => setRegPrimerStatus(e.target.value)} className="w-full px-3 py-2 text-sm border rounded">
                                                    <option>Designed</option>
                                                    <option>Ordered</option>
                                                    <option>Arrived</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div className="bg-purple-50 p-4 rounded-lg border border-purple-200">
                                            <h4 className="font-semibold text-gray-900 mb-3">Storage (1 vial)</h4>
                                            <div className="grid grid-cols-3 gap-2">
                                                <select value={regFreezer} onChange={(e) => setRegFreezer(e.target.value)} className="px-2 py-2 text-sm border rounded">
                                                    <option>AE_Freezer 1 (-20C)</option>
                                                    <option>AE_Freezer 2 (-20C)</option>
                                                </select>
                                                <select value={regShelf} onChange={(e) => setRegShelf(e.target.value)} className="px-2 py-2 text-sm border rounded">
                                                    {['A', 'B', 'C', 'D', 'E', 'F'].map(s => <option key={s} value={s}>{s}</option>)}
                                                </select>
                                                <select value={regBox} onChange={(e) => setRegBox(e.target.value)} className="px-2 py-2 text-sm border rounded">
                                                    {getRegBoxes().map(b => <option key={b.number} value={b.number}>Box {b.number} ({b.count}/100)</option>)}
                                                </select>
                                            </div>
                                        </div>

                                        <button
                                            onClick={generateRegPrimer}
                                            disabled={!regPrimerSeq.trim() || !regPrimerDesc.trim()}
                                            className="w-full bg-purple-600 text-white font-bold py-3 rounded-lg hover:bg-purple-700 disabled:opacity-50 transition"
                                        >
                                            <i className="fas fa-plus"></i> Add Regular Primer
                                        </button>

                                        {/* Bulk Upload Section */}
                                        <div className="border-t-2 border-gray-200 pt-4 mt-4">
                                            <h4 className="text-sm font-bold text-gray-900 mb-3">📊 Bulk Import</h4>
                                            <div className="space-y-2">
                                                <button
                                                    onClick={downloadRegTemplate}
                                                    className="w-full px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition text-sm font-semibold flex items-center justify-center gap-2"
                                                >
                                                    <i className="fas fa-download"></i> Download Template
                                                </button>
                                                <label className="w-full">
                                                    <div className="px-4 py-2 bg-purple-100 text-purple-700 rounded-lg hover:bg-purple-200 transition text-sm font-semibold flex items-center justify-center gap-2 cursor-pointer">
                                                        <i className="fas fa-upload"></i> Upload Filled Template
                                                    </div>
                                                    <input
                                                        type="file"
                                                        accept=".csv"
                                                        onChange={uploadRegFile}
                                                        className="hidden"
                                                    />
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* Regular Primers Table */}
                                {regPrimers.length > 0 && (
                                    <div className="bg-white rounded-xl shadow-lg p-8">
                                        <div className="flex justify-between items-center mb-4">
                                            <h3 className="text-xl font-bold text-gray-900">Regular Primers (PR)</h3>
                                            <button onClick={exportReg} className="px-3 py-2 bg-green-600 text-white rounded text-sm hover:bg-green-700">
                                                <i className="fas fa-download"></i> Export PR
                                            </button>
                                        </div>
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-xs">
                                                <thead>
                                                    <tr className="border-b">
                                                        <th className="text-left py-2">No</th>
                                                        <th className="text-left py-2">Name</th>
                                                        <th className="text-left py-2">Sequence</th>
                                                        <th className="text-center py-2">Length</th>
                                                        <th className="text-center py-2">Tm</th>
                                                        <th className="text-center py-2">Status</th>
                                                        <th className="text-right py-2">Actions</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {regSorted.map(p => (
                                                        <tr key={p.id} className="border-b hover:bg-purple-50">
                                                            <td className="py-2">{p.number}</td>
                                                            <td className="py-2 font-bold text-purple-600">{p.name}</td>
                                                            <td className="py-2 font-mono text-xs truncate">{p.sequence}</td>
                                                            <td className="py-2 text-center">{p.length}</td>
                                                            <td className="py-2 text-center">{p.tm}</td>
                                                            <td className={`py-2 text-center font-bold ${p.status === 'Arrived' ? 'text-green-600' : p.status === 'Ordered' ? 'text-yellow-600' : 'text-blue-600'}`}>{p.status}</td>
                                                            <td className="py-2"><RowActions seq={p.sequence} copyKey={p.id}
                                                                onEdit={() => startEditReg(p)} onCopy={() => copyReg(p)} onDelete={() => deleteReg(p)} /></td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* The one panel here that is not a browser calculation */}
                        <ServerPrimerDesign />
                    </div>

                    {/* Editing one primer, or one gRNA pair */}
                    {editing && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4" onClick={e => { if (e.target === e.currentTarget) setEditing(null); }}>
                            <div className="bg-white rounded-xl shadow-2xl p-6 max-w-lg w-full max-h-full overflow-auto">
                                <h3 className="text-xl font-bold text-gray-900 mb-4">
                                    Edit {editing.kind === 'reg' ? editing.draft.name : editing.draft.forwardName + ' / ' + editing.draft.reverseName}
                                </h3>
                                {editing.kind === 'reg' ? (
                                    <div className="space-y-3 text-sm">
                                        <label className="block"><span className="font-semibold text-gray-700">Name</span>
                                            <input className="mt-1 w-full border rounded px-3 py-2" value={editing.draft.name || ''} onChange={e => setDraft('name', e.target.value)} /></label>
                                        <label className="block"><span className="font-semibold text-gray-700">Sequence (5′→3′)</span>
                                            <textarea rows={2} className="mt-1 w-full border rounded px-3 py-2 font-mono" value={editing.draft.sequence || ''} onChange={e => setDraft('sequence', e.target.value)} />
                                            <span className="text-xs text-gray-500">{cleanSeq(editing.draft.sequence).length} nt · Tm {calculateTm(cleanSeq(editing.draft.sequence))}</span></label>
                                        <label className="block"><span className="font-semibold text-gray-700">Description</span>
                                            <input className="mt-1 w-full border rounded px-3 py-2" value={editing.draft.description || ''} onChange={e => setDraft('description', e.target.value)} /></label>
                                        <div className="grid grid-cols-3 gap-3">
                                            <label className="block"><span className="font-semibold text-gray-700">Orientation</span>
                                                <select className="mt-1 w-full border rounded px-2 py-2" value={editing.draft.orientation || 'Frw'} onChange={e => setDraft('orientation', e.target.value)}>
