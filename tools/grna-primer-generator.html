<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primer Generator - Dual System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .copy-icon { cursor: pointer; transition: all 0.2s; }
        .copy-icon:hover { transform: scale(1.2); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function PrimerGenerator() {
            // ===== gRNA CLONING PRIMERS (PRg) =====
            const [grnaSpacetr, setGrnaSpacetr] = useState('');
            const [grnaPrimers, setGrnaPrimers] = useState([]);
            const [grnaDescription, setGrnaDescription] = useState('');
            const [grnaPrimerCounter, setGrnaPrimerCounter] = useState(1);
            const [grnaFreezer, setGrnaFreezer] = useState('AE_Freezer 1 (-20C)');
            const [grnaShelf, setGrnaShelf] = useState('A');
            const [grnaBox, setGrnaBox] = useState('1');
            
            // ===== REGULAR PRIMERS (PR) =====
            const [regPrimerSeq, setRegPrimerSeq] = useState('');
            const [regPrimers, setRegPrimers] = useState([]);
            const [regPrimerDesc, setRegPrimerDesc] = useState('');
            const [regPrimerOrientation, setRegPrimerOrientation] = useState('Frw');
            const [regPrimerCounter, setRegPrimerCounter] = useState(1);
            const [regFreezer, setRegFreezer] = useState('AE_Freezer 1 (-20C)');
            const [regShelf, setRegShelf] = useState('A');
            const [regBox, setRegBox] = useState('1');
            const [regPrimerVendor, setRegPrimerVendor] = useState('IDT');
            const [regPrimerStatus, setRegPrimerStatus] = useState('Designed');
            const [showClearModal, setShowClearModal] = useState(false);
            const [clearPasscode, setClearPasscode] = useState('');
            const CLEAR_PASSCODE = 'DELETE123'; // Set your secure passcode here

            const BOX_CAPACITY = 100;

            // Load from localStorage
            React.useEffect(() => {
                const savedGrna = localStorage.getItem('grnaPrimers');
                const savedGrnaCounter = localStorage.getItem('grnaPrimerCounter');
                const savedReg = localStorage.getItem('regPrimers');
                const savedRegCounter = localStorage.getItem('regPrimerCounter');
                
                if (savedGrna) setGrnaPrimers(JSON.parse(savedGrna));
                if (savedGrnaCounter) setGrnaPrimerCounter(parseInt(JSON.parse(savedGrnaCounter)));
                if (savedReg) setRegPrimers(JSON.parse(savedReg));
                if (savedRegCounter) setRegPrimerCounter(parseInt(JSON.parse(savedRegCounter)));
            }, []);

            // Save to localStorage
            React.useEffect(() => { if (grnaPrimers.length > 0) localStorage.setItem('grnaPrimers', JSON.stringify(grnaPrimers)); }, [grnaPrimers]);
            React.useEffect(() => { localStorage.setItem('grnaPrimerCounter', JSON.stringify(grnaPrimerCounter)); }, [grnaPrimerCounter]);
            React.useEffect(() => { if (regPrimers.length > 0) localStorage.setItem('regPrimers', JSON.stringify(regPrimers)); }, [regPrimers]);
            React.useEffect(() => { localStorage.setItem('regPrimerCounter', JSON.stringify(regPrimerCounter)); }, [regPrimerCounter]);

            // Tm calculation
            const calculateTm = (sequence) => {
                if (!sequence || sequence.length < 14) return 'N/A';
                const seq = sequence.toUpperCase();
                const gcCount = (seq.match(/G/g) || []).length + (seq.match(/C/g) || []).length;
                const gcPercent = gcCount / seq.length;
                const tm = 64.9 + 41 * (gcPercent - 0.675) / (seq.length - 0.675);
                return tm.toFixed(1);
            };

            // Reverse complement
            const getReverseComplement = (seq) => {
                const complement = { 'A': 'T', 'T': 'A', 'G': 'C', 'C': 'G', 'a': 't', 't': 'a', 'g': 'c', 'c': 'g' };
                return seq.split('').reverse().map(base => complement[base] || base).join('');
            };

            const isValidDNASequence = (seq) => /^[ATGCatgc]{20}$/.test(seq);

            // ===== gRNA CLONING FUNCTIONS =====
            const generateGrnaPrimer = () => {
                if (!isValidDNASequence(grnaSpacetr)) {
                    alert('Please enter a valid 20 bp DNA sequence (only ATGC)');
                    return;
                }

                const forwardInvariant = 'GTTTCAGAGCTATGCTGGAAACAG';
                const reverseInvariant = 'ggtgtttcgtcctttccac';
                const forwardPrimer = grnaSpacetr.toUpperCase() + forwardInvariant;
                const reverseComplement = getReverseComplement(grnaSpacetr.toUpperCase());
                const reversePrimer = reverseComplement + reverseInvariant;

                const forwardNumber = grnaPrimerCounter;
                const reverseNumber = grnaPrimerCounter + 1;

                const newPrimer = {
                    id: Date.now(),
                    forwardNumber,
                    reverseNumber,
                    forwardName: `PRg${forwardNumber}_Frw`,
                    reverseName: `PRg${reverseNumber}_Rev`,
                    spacerSeq: grnaSpacetr.toUpperCase(),
                    forwardPrimer,
                    reversePrimer,
                    forwardLength: forwardPrimer.length,
                    reverseLength: reversePrimer.length,
                    description: grnaDescription,
                    freezer: grnaFreezer,
                    shelf: grnaShelf,
                    box: grnaBox
                };

                setGrnaPrimers([...grnaPrimers, newPrimer]);
                setGrnaPrimerCounter(grnaPrimerCounter + 2);
                setGrnaSpacetr('');
                setGrnaDescription('');
            };

            const getGrnaAvailableBox = () => {
                const boxCounts = {};
                grnaPrimers.forEach(p => {
                    const key = `${p.freezer}_${p.shelf}_${p.box}`;
                    boxCounts[key] = (boxCounts[key] || 0) + 2;
                });
                let box = 1;
                while ((boxCounts[`${grnaFreezer}_${grnaShelf}_${box}`] || 0) >= BOX_CAPACITY) box++;
                return box;
            };

            const getGrnaBoxes = () => {
                const boxCounts = {};
                grnaPrimers.forEach(p => {
                    const key = `${p.freezer}_${p.shelf}_${p.box}`;
                    boxCounts[key] = (boxCounts[key] || 0) + 2;
                });
                const current = getGrnaAvailableBox();
                const boxes = [];
                for (let i = 1; i <= current; i++) {
                    const key = `${grnaFreezer}_${grnaShelf}_${i}`;
                    const count = boxCounts[key] || 0;
                    boxes.push({ number: i, count, isFull: count >= BOX_CAPACITY });
                }
                return boxes;
            };

            // ===== REGULAR PRIMER FUNCTIONS =====
            const generateRegPrimer = () => {
                if (!regPrimerSeq.trim()) {
                    alert('Please enter a primer sequence');
                    return;
                }
                if (!regPrimerDesc.trim()) {
                    alert('Description is required');
                    return;
                }

                const primerNumber = regPrimerCounter;
                const descSnippet = regPrimerDesc.substring(0, 20);
                const primerName = `PR${primerNumber}_${descSnippet}`;

                const newPrimer = {
                    id: Date.now(),
                    number: primerNumber,
                    name: primerName,
                    sequence: regPrimerSeq.toUpperCase(),
                    length: regPrimerSeq.length,
                    tm: calculateTm(regPrimerSeq),
                    description: regPrimerDesc,
                    orientation: regPrimerOrientation,
                    freezer: regFreezer,
                    shelf: regShelf,
                    box: regBox,
                    vendor: regPrimerVendor,
                    status: regPrimerStatus
                };

                setRegPrimers([...regPrimers, newPrimer]);
                setRegPrimerCounter(regPrimerCounter + 1);
                setRegPrimerSeq('');
                setRegPrimerDesc('');
            };

            const getRegAvailableBox = () => {
                const boxCounts = {};
                regPrimers.forEach(p => {
                    const key = `${p.freezer}_${p.shelf}_${p.box}`;
                    boxCounts[key] = (boxCounts[key] || 0) + 1;
                });
                let box = 1;
                while ((boxCounts[`${regFreezer}_${regShelf}_${box}`] || 0) >= BOX_CAPACITY) box++;
                return box;
            };

            const getRegBoxes = () => {
                const boxCounts = {};
                regPrimers.forEach(p => {
                    const key = `${p.freezer}_${p.shelf}_${p.box}`;
                    boxCounts[key] = (boxCounts[key] || 0) + 1;
                });
                const current = getRegAvailableBox();
                const boxes = [];
                for (let i = 1; i <= current; i++) {
                    const key = `${regFreezer}_${regShelf}_${i}`;
                    const count = boxCounts[key] || 0;
                    boxes.push({ number: i, count, isFull: count >= BOX_CAPACITY });
                }
                return boxes;
            };

            // Export functions
            const exportGrna = () => {
                let csv = 'gRNA Cloning Primers (PRg)\n\nNo,Name,Sequence,Length,Tm,Freezer,Shelf,Box,Description\n';
                grnaPrimers.forEach(p => {
                    const forwardTm = calculateTm(p.forwardPrimer);
                    const reverseTm = calculateTm(p.reversePrimer);
                    csv += `${p.forwardNumber},"${p.forwardName}","${p.forwardPrimer}",${p.forwardLength},${forwardTm},"${p.freezer}","${p.shelf}","${p.box}","${p.description}"\n`;
                    csv += `${p.reverseNumber},"${p.reverseName}","${p.reversePrimer}",${p.reverseLength},${reverseTm},"${p.freezer}","${p.shelf}","${p.box}","${p.description}"\n`;
                });
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'PRg_gRNA_Cloning_Primers.csv';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const exportReg = () => {
                let csv = 'Regular Primers (PR)\n\nNo,Name,Sequence,Length,Tm,Orientation,Freezer,Shelf,Box,Vendor,Status,Description\n';
                regPrimers.forEach(p => {
                    csv += `${p.number},"${p.name}","${p.sequence}",${p.length},${p.tm},"${p.orientation}","${p.freezer}","${p.shelf}","${p.box}","${p.vendor}","${p.status}","${p.description}"\n`;
                });
                const blob = new Blob([csv], { type: 'text/csv' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'PR_Regular_Primers.csv';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const clearAll = () => {
                setShowClearModal(true);
                setClearPasscode('');
            };

            const confirmClearAll = () => {
                if (clearPasscode.toUpperCase() === CLEAR_PASSCODE) {
                    setGrnaPrimers([]);
                    setGrnaPrimerCounter(1);
                    setRegPrimers([]);
                    setRegPrimerCounter(1);
                    localStorage.removeItem('grnaPrimers');
                    localStorage.removeItem('grnaPrimerCounter');
                    localStorage.removeItem('regPrimers');
                    localStorage.removeItem('regPrimerCounter');
                    setShowClearModal(false);
                    setClearPasscode('');
                    alert('✓ All data has been deleted successfully');
                } else {
                    alert('✗ Incorrect passcode. Please try again.');
                    setClearPasscode('');
                }
            };

            // ===== BULK UPLOAD FUNCTIONS =====
            const downloadGrnaTemplate = () => {
                const templateData = [
                    ['20bp Spacer', 'Description', 'Freezer', 'Shelf', 'Box'],
                    ['ATCGATCGATCGATCGATCG', 'Example gRNA 1', 'AE_Freezer 1 (-20C)', 'A', '1'],
                    ['GCTAGCTAGCTAGCTAGCTA', 'Example gRNA 2', 'AE_Freezer 1 (-20C)', 'A', '1'],
                    ['', '', '', '', ''],
                    ['', '', '', '', '']
                ];

                let csv = 'data:text/csv;charset=utf-8,';
                templateData.forEach(row => {
                    csv += row.map(cell => `"${cell}"`).join(',') + '\n';
                });

                const link = document.createElement('a');
                link.setAttribute('href', encodeURI(csv));
                link.setAttribute('download', 'gRNA_Primers_Template.csv');
                link.style.display = 'none';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const downloadRegTemplate = () => {
                const templateData = [
                    ['Sequence', 'Orientation', 'Description', 'Vendor', 'Status', 'Freezer', 'Shelf', 'Box'],
                    ['ATCGATCGATCGATCGATCG', 'Frw', 'Example primer 1', 'IDT', 'Designed', 'AE_Freezer 1 (-20C)', 'A', '1'],
                    ['GCTAGCTAGCTAGCTAGCTA', 'Rev', 'Example primer 2', 'GeneScript', 'Ordered', 'AE_Freezer 1 (-20C)', 'A', '1'],
                    ['', '', '', '', '', '', '', ''],
                    ['', '', '', '', '', '', '', '']
                ];

                let csv = 'data:text/csv;charset=utf-8,';
                templateData.forEach(row => {
                    csv += row.map(cell => `"${cell}"`).join(',') + '\n';
                });

                const link = document.createElement('a');
                link.setAttribute('href', encodeURI(csv));
                link.setAttribute('download', 'Regular_Primers_Template.csv');
                link.style.display = 'none';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const uploadGrnaFile = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        // Parse CSV
                        const csv = e.target.result;
                        const lines = csv.split('\n').filter(line => line.trim());
                        const headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim());
                        
                        let addedCount = 0;
                        const newPrimers = [...grnaPrimers];
                        let counter = grnaPrimerCounter;

                        for (let i = 1; i < lines.length; i++) {
                            const values = lines[i].split(',').map(v => v.replace(/"/g, '').trim());
                            if (!values[0]) continue; // Skip empty rows

                            const spacer = values[0];
                            if (!isValidDNASequence(spacer)) continue;

                            const description = values[1] || '';
                            const freezer = values[2] || 'AE_Freezer 1 (-20C)';
                            const shelf = values[3] || 'A';
                            const box = values[4] || '1';

                            const forwardInvariant = 'GTTTCAGAGCTATGCTGGAAACAG';
                            const reverseInvariant = 'ggtgtttcgtcctttccac';
                            const forwardPrimer = spacer.toUpperCase() + forwardInvariant;
                            const reverseComplement = getReverseComplement(spacer.toUpperCase());
                            const reversePrimer = reverseComplement + reverseInvariant;

                            const forwardNumber = counter;
                            const reverseNumber = counter + 1;

                            newPrimers.push({
                                id: Date.now() + addedCount,
                                forwardNumber,
                                reverseNumber,
                                forwardName: `PRg${forwardNumber}_Frw`,
                                reverseName: `PRg${reverseNumber}_Rev`,
                                spacerSeq: spacer.toUpperCase(),
                                forwardPrimer,
                                reversePrimer,
                                forwardLength: forwardPrimer.length,
                                reverseLength: reversePrimer.length,
                                description,
                                freezer,
                                shelf,
                                box
                            });

                            counter += 2;
                            addedCount++;
                        }

                        if (addedCount > 0) {
                            setGrnaPrimers(newPrimers);
                            setGrnaPrimerCounter(counter);
                            alert(`✓ Successfully imported ${addedCount} gRNA primer pairs`);
                        } else {
                            alert('✗ No valid primers found in file');
                        }
                        event.target.value = '';
                    } catch (error) {
                        alert('✗ Error reading file: ' + error.message);
                    }
                };
                reader.readAsText(file);
            };

            const uploadRegFile = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        // Parse CSV
                        const csv = e.target.result;
                        const lines = csv.split('\n').filter(line => line.trim());
                        const headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim());
                        
                        let addedCount = 0;
                        const newPrimers = [...regPrimers];
                        let counter = regPrimerCounter;

                        for (let i = 1; i < lines.length; i++) {
                            const values = lines[i].split(',').map(v => v.replace(/"/g, '').trim());
                            if (!values[0] || !values[2]) continue; // Skip empty rows or rows without sequence/description

                            const sequence = values[0].toUpperCase();
                            const orientation = values[1] || 'Frw';
                            const description = values[2];
                            const vendor = values[3] || 'IDT';
                            const status = values[4] || 'Designed';
                            const freezer = values[5] || 'AE_Freezer 1 (-20C)';
                            const shelf = values[6] || 'A';
                            const box = values[7] || '1';

                            const descSnippet = description.substring(0, 20);
                            const primerName = `PR${counter}_${descSnippet}`;

                            newPrimers.push({
                                id: Date.now() + addedCount,
                                number: counter,
                                name: primerName,
                                sequence,
                                length: sequence.length,
                                tm: calculateTm(sequence),
                                description,
                                orientation,
                                freezer,
                                shelf,
                                box,
                                vendor,
                                status
                            });

                            counter++;
                            addedCount++;
                        }

                        if (addedCount > 0) {
                            setRegPrimers(newPrimers);
                            setRegPrimerCounter(counter);
                            alert(`✓ Successfully imported ${addedCount} regular primers`);
                        } else {
                            alert('✗ No valid primers found in file');
                        }
                        event.target.value = '';
                    } catch (error) {
                        alert('✗ Error reading file: ' + error.message);
                    }
                };
                reader.readAsText(file);
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-50 to-blue-50 p-8">
                    <div className="max-w-7xl mx-auto">
                        {/* Header */}
                        <div className="mb-8">
                            <h1 className="text-4xl font-bold text-gray-900 mb-2">Primer Generator - Dual System</h1>
                            <p className="text-lg text-gray-600">Separate documentation for gRNA cloning (PRg) and regular primers (PR)</p>
                        </div>

                        {/* Data Management */}
                        <div className="mb-8 bg-gradient-to-r from-blue-50 to-indigo-50 border-l-4 border-indigo-500 rounded-lg p-6 shadow">
                            <div className="flex items-center justify-between flex-wrap gap-4">
                                <div>
                                    <h3 className="text-lg font-bold text-gray-900 mb-2">💾 Saved Primers</h3>
                                    <div className="flex gap-8">
                                        <div>
                                            <p className="text-sm text-gray-600">gRNA Cloning (PRg)</p>
                                            <p className="text-2xl font-bold text-blue-600">{grnaPrimers.length * 2}</p>
                                        </div>
                                        <div>
                                            <p className="text-sm text-gray-600">Regular (PR)</p>
                                            <p className="text-2xl font-bold text-purple-600">{regPrimers.length}</p>
                                        </div>
                                        <div>
                                            <p className="text-sm text-gray-600">Total Vials</p>
                                            <p className="text-2xl font-bold text-indigo-600">{(grnaPrimers.length * 2) + regPrimers.length}</p>
                                        </div>
                                    </div>
                                </div>
                                <button onClick={clearAll} className="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition flex items-center gap-2 font-semibold">
                                    <i className="fas fa-trash"></i> Clear All
                                </button>
                            </div>
                        </div>

                        {/* Two Column Layout */}
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                            {/* ===== gRNA CLONING SECTION ===== */}
                            <div className="space-y-6">
                                <div className="bg-white rounded-xl shadow-lg p-8 border-l-4 border-blue-500">
                                    <h2 className="text-2xl font-bold text-gray-900 mb-2">gRNA Cloning Primers</h2>
                                    <p className="text-gray-600 mb-6">Design Gibson cloning primers (PRg)</p>

                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">20 bp Spacer Sequence</label>
                                            <input
                                                type="text"
                                                value={grnaSpacetr}
                                                onChange={(e) => setGrnaSpacetr(e.target.value.toUpperCase())}
                                                placeholder="Enter 20 bp sequence"
                                                maxLength="20"
                                                className="w-full px-4 py-3 font-mono text-lg border-2 border-gray-300 rounded-lg focus:border-blue-500 outline-none transition"
                                            />
                                            <p className="text-xs text-gray-500 mt-2">{grnaSpacetr.length}/20 bp</p>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">Description (Optional)</label>
                                            <textarea
                                                value={grnaDescription}
                                                onChange={(e) => setGrnaDescription(e.target.value)}
                                                placeholder="e.g., Target: BRCA1"
                                                rows="3"
                                                className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-blue-500 outline-none transition resize-none"
                                            />
                                        </div>

                                        <div className="bg-blue-50 p-4 rounded-lg border border-blue-200">
                                            <h4 className="font-semibold text-gray-900 mb-3">Storage (2 vials)</h4>
                                            <div className="grid grid-cols-3 gap-2">
                                                <select value={grnaFreezer} onChange={(e) => setGrnaFreezer(e.target.value)} className="px-2 py-2 text-sm border rounded">
                                                    <option>AE_Freezer 1 (-20C)</option>
                                                    <option>AE_Freezer 2 (-20C)</option>
                                                </select>
                                                <select value={grnaShelf} onChange={(e) => setGrnaShelf(e.target.value)} className="px-2 py-2 text-sm border rounded">
                                                    {['A', 'B', 'C', 'D', 'E', 'F'].map(s => <option key={s} value={s}>{s}</option>)}
                                                </select>
                                                <select value={grnaBox} onChange={(e) => setGrnaBox(e.target.value)} className="px-2 py-2 text-sm border rounded">
                                                    {getGrnaBoxes().map(b => <option key={b.number} value={b.number}>Box {b.number} ({b.count}/100)</option>)}
                                                </select>
                                            </div>
                                        </div>

                                        <button
                                            onClick={generateGrnaPrimer}
                                            disabled={grnaSpacetr.length !== 20 || !isValidDNASequence(grnaSpacetr)}
                                            className="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 disabled:opacity-50 transition"
                                        >
                                            <i className="fas fa-plus"></i> Generate gRNA Primers
                                        </button>

                                        {/* Bulk Upload Section */}
                                        <div className="border-t-2 border-gray-200 pt-4 mt-4">
                                            <h4 className="text-sm font-bold text-gray-900 mb-3">📊 Bulk Import</h4>
                                            <div className="space-y-2">
                                                <button
                                                    onClick={downloadGrnaTemplate}
                                                    className="w-full px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition text-sm font-semibold flex items-center justify-center gap-2"
                                                >
                                                    <i className="fas fa-download"></i> Download Template
                                                </button>
                                                <label className="w-full">
                                                    <div className="px-4 py-2 bg-blue-100 text-blue-700 rounded-lg hover:bg-blue-200 transition text-sm font-semibold flex items-center justify-center gap-2 cursor-pointer">
                                                        <i className="fas fa-upload"></i> Upload Filled Template
                                                    </div>
                                                    <input
                                                        type="file"
                                                        accept=".csv"
                                                        onChange={uploadGrnaFile}
                                                        className="hidden"
                                                    />
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* gRNA Table */}
                                {grnaPrimers.length > 0 && (
                                    <div className="bg-white rounded-xl shadow-lg p-8">
                                        <div className="flex justify-between items-center mb-4">
                                            <h3 className="text-xl font-bold text-gray-900">gRNA Primers (PRg)</h3>
                                            <button onClick={exportGrna} className="px-3 py-2 bg-green-600 text-white rounded text-sm hover:bg-green-700">
                                                <i className="fas fa-download"></i> Export PRg
                                            </button>
                                        </div>
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-xs">
                                                <thead>
                                                    <tr className="border-b">
                                                        <th className="text-left py-2">No</th>
                                                        <th className="text-left py-2">Name</th>
                                                        <th className="text-left py-2">Sequence</th>
                                                        <th className="text-center py-2">Length</th>
                                                        <th className="text-center py-2">Tm</th>
                                                        <th className="text-center py-2">Box</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {grnaPrimers.map(p => (
                                                        <React.Fragment key={p.id}>
                                                            <tr className="border-b hover:bg-blue-50">
                                                                <td className="py-2">{p.forwardNumber}</td>
                                                                <td className="py-2 font-bold text-blue-600">{p.forwardName}</td>
                                                                <td className="py-2 font-mono text-xs truncate">{p.forwardPrimer}</td>
                                                                <td className="py-2 text-center">{p.forwardLength}</td>
                                                                <td className="py-2 text-center">{calculateTm(p.forwardPrimer)}</td>
                                                                <td className="py-2 text-center">{p.box}</td>
                                                            </tr>
                                                            <tr className="border-b hover:bg-red-50">
                                                                <td className="py-2">{p.reverseNumber}</td>
                                                                <td className="py-2 font-bold text-red-600">{p.reverseName}</td>
                                                                <td className="py-2 font-mono text-xs truncate">{p.reversePrimer}</td>
                                                                <td className="py-2 text-center">{p.reverseLength}</td>
                                                                <td className="py-2 text-center">{calculateTm(p.reversePrimer)}</td>
                                                                <td className="py-2 text-center">{p.box}</td>
                                                            </tr>
                                                        </React.Fragment>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* ===== REGULAR PRIMERS SECTION ===== */}
                            <div className="space-y-6">
                                <div className="bg-white rounded-xl shadow-lg p-8 border-l-4 border-purple-500">
                                    <h2 className="text-2xl font-bold text-gray-900 mb-2">Regular Primers</h2>
                                    <p className="text-gray-600 mb-6">Document other primers (PR)</p>

                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">Primer Sequence</label>
                                            <input
                                                type="text"
                                                value={regPrimerSeq}
                                                onChange={(e) => setRegPrimerSeq(e.target.value.toUpperCase())}
                                                placeholder="Enter primer sequence"
                                                className="w-full px-4 py-3 font-mono border-2 border-gray-300 rounded-lg focus:border-purple-500 outline-none transition"
                                            />
                                            <p className="text-xs text-gray-500 mt-2">{regPrimerSeq.length} bp</p>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">Orientation</label>
                                            <select value={regPrimerOrientation} onChange={(e) => setRegPrimerOrientation(e.target.value)} className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-purple-500 outline-none">
                                                <option value="Frw">Forward (Frw)</option>
                                                <option value="Rev">Reverse (Rev)</option>
                                            </select>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-semibold text-gray-700 mb-2">Description * (Required)</label>
                                            <textarea
                                                value={regPrimerDesc}
                                                onChange={(e) => setRegPrimerDesc(e.target.value)}
                                                placeholder="e.g., BRCA1 screening"
                                                rows="3"
                                                className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-purple-500 outline-none transition resize-none"
                                            />
                                        </div>

                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="block text-xs font-semibold text-gray-700 mb-2">Vendor</label>
                                                <select value={regPrimerVendor} onChange={(e) => setRegPrimerVendor(e.target.value)} className="w-full px-3 py-2 text-sm border rounded">
                                                    <option>IDT</option>
                                                    <option>GeneScript</option>
                                                    <option>HyLabs</option>
                                                    <option>TwistBio</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-semibold text-gray-700 mb-2">Status</label>
                                                <select value={regPrimerStatus} onChange={(e) => setRegPrimerStatus(e.target.value)} className="w-full px-3 py-2 text-sm border rounded">
                                                    <option>Designed</option>
                                                    <option>Ordered</option>
                                                    <option>Arrived</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div className="bg-purple-50 p-4 rounded-lg border border-purple-200">
                                            <h4 className="font-semibold text-gray-900 mb-3">Storage (1 vial)</h4>
                                            <div className="grid grid-cols-3 gap-2">
                                                <select value={regFreezer} onChange={(e) => setRegFreezer(e.target.value)} className="px-2 py-2 text-sm border rounded">
                                                    <option>AE_Freezer 1 (-20C)</option>
                                                    <option>AE_Freezer 2 (-20C)</option>
                                                </select>
                                                <select value={regShelf} onChange={(e) => setRegShelf(e.target.value)} className="px-2 py-2 text-sm border rounded">
                                                    {['A', 'B', 'C', 'D', 'E', 'F'].map(s => <option key={s} value={s}>{s}</option>)}
                                                </select>
                                                <select value={regBox} onChange={(e) => setRegBox(e.target.value)} className="px-2 py-2 text-sm border rounded">
                                                    {getRegBoxes().map(b => <option key={b.number} value={b.number}>Box {b.number} ({b.count}/100)</option>)}
                                                </select>
                                            </div>
                                        </div>

                                        <button
                                            onClick={generateRegPrimer}
                                            disabled={!regPrimerSeq.trim() || !regPrimerDesc.trim()}
                                            className="w-full bg-purple-600 text-white font-bold py-3 rounded-lg hover:bg-purple-700 disabled:opacity-50 transition"
                                        >
                                            <i className="fas fa-plus"></i> Add Regular Primer
                                        </button>

                                        {/* Bulk Upload Section */}
                                        <div className="border-t-2 border-gray-200 pt-4 mt-4">
                                            <h4 className="text-sm font-bold text-gray-900 mb-3">📊 Bulk Import</h4>
                                            <div className="space-y-2">
                                                <button
                                                    onClick={downloadRegTemplate}
                                                    className="w-full px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition text-sm font-semibold flex items-center justify-center gap-2"
                                                >
                                                    <i className="fas fa-download"></i> Download Template
                                                </button>
                                                <label className="w-full">
                                                    <div className="px-4 py-2 bg-purple-100 text-purple-700 rounded-lg hover:bg-purple-200 transition text-sm font-semibold flex items-center justify-center gap-2 cursor-pointer">
                                                        <i className="fas fa-upload"></i> Upload Filled Template
                                                    </div>
                                                    <input
                                                        type="file"
                                                        accept=".csv"
                                                        onChange={uploadRegFile}
                                                        className="hidden"
                                                    />
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* Regular Primers Table */}
                                {regPrimers.length > 0 && (
                                    <div className="bg-white rounded-xl shadow-lg p-8">
                                        <div className="flex justify-between items-center mb-4">
                                            <h3 className="text-xl font-bold text-gray-900">Regular Primers (PR)</h3>
                                            <button onClick={exportReg} className="px-3 py-2 bg-green-600 text-white rounded text-sm hover:bg-green-700">
                                                <i className="fas fa-download"></i> Export PR
                                            </button>
                                        </div>
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-xs">
                                                <thead>
                                                    <tr className="border-b">
                                                        <th className="text-left py-2">No</th>
                                                        <th className="text-left py-2">Name</th>
                                                        <th className="text-left py-2">Sequence</th>
                                                        <th className="text-center py-2">Length</th>
                                                        <th className="text-center py-2">Tm</th>
                                                        <th className="text-center py-2">Status</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {regPrimers.map(p => (
                                                        <tr key={p.id} className="border-b hover:bg-purple-50">
                                                            <td className="py-2">{p.number}</td>
                                                            <td className="py-2 font-bold text-purple-600">{p.name}</td>
                                                            <td className="py-2 font-mono text-xs truncate">{p.sequence}</td>
                                                            <td className="py-2 text-center">{p.length}</td>
                                                            <td className="py-2 text-center">{p.tm}</td>
                                                            <td className={`py-2 text-center font-bold ${p.status === 'Arrived' ? 'text-green-600' : p.status === 'Ordered' ? 'text-yellow-600' : 'text-blue-600'}`}>{p.status}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* Passcode Confirmation Modal */}
                    {showClearModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                            <div className="bg-white rounded-xl shadow-2xl p-8 max-w-sm w-full mx-4">
                                <div className="mb-6">
                                    <h3 className="text-2xl font-bold text-gray-900 mb-2">⚠️ Delete All Data</h3>
                                    <p className="text-gray-600">This action cannot be undone. All primers will be permanently deleted.</p>
                                </div>

                                <div className="mb-6">
                                    <label className="block text-sm font-semibold text-gray-700 mb-3">Enter passcode to confirm:</label>
                                    <input
                                        type="password"
                                        value={clearPasscode}
                                        onChange={(e) => setClearPasscode(e.target.value)}
                                        onKeyPress={(e) => e.key === 'Enter' && confirmClearAll()}
                                        placeholder="Enter passcode"
                                        autoFocus
                                        className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-red-500 outline-none transition font-mono text-center text-lg tracking-widest"
                                    />
                                    <p className="text-xs text-gray-500 mt-2">Passcode is case-insensitive</p>
                                </div>

                                <div className="flex gap-3">
                                    <button
                                        onClick={() => {
                                            setShowClearModal(false);
                                            setClearPasscode('');
                                        }}
                                        className="flex-1 px-4 py-3 border-2 border-gray-300 text-gray-700 font-bold rounded-lg hover:border-gray-400 transition"
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        onClick={confirmClearAll}
                                        className="flex-1 px-4 py-3 bg-red-600 text-white font-bold rounded-lg hover:bg-red-700 transition"
                                    >
                                        Delete All
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PrimerGenerator />);
    </script>
</body>
</html>
