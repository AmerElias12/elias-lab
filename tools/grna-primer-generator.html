                                                    <option value="Frw">Forward</option><option value="Rev">Reverse</option></select></label>
                                            <label className="block"><span className="font-semibold text-gray-700">Vendor</span>
                                                <input className="mt-1 w-full border rounded px-2 py-2" value={editing.draft.vendor || ''} onChange={e => setDraft('vendor', e.target.value)} /></label>
                                            <label className="block"><span className="font-semibold text-gray-700">Status</span>
                                                <select className="mt-1 w-full border rounded px-2 py-2" value={editing.draft.status || 'Designed'} onChange={e => setDraft('status', e.target.value)}>
                                                    <option>Designed</option><option>Ordered</option><option>Arrived</option></select></label>
                                        </div>
                                    </div>
                                ) : (
                                    <div className="space-y-3 text-sm">
                                        <label className="block"><span className="font-semibold text-gray-700">Spacer (20 bp)</span>
                                            <input className="mt-1 w-full border rounded px-3 py-2 font-mono" value={editing.draft.spacerSeq || ''} onChange={e => setDraft('spacerSeq', e.target.value)} /></label>
                                        <div className="grid grid-cols-3 gap-3">
                                            <label className="block"><span className="font-semibold text-gray-700">Forward name</span>
                                                <input className="mt-1 w-full border rounded px-2 py-2" value={editing.draft.forwardName || ''} onChange={e => setDraft('forwardName', e.target.value)} /></label>
                                            <label className="block col-span-2"><span className="font-semibold text-gray-700">Forward primer</span>
                                                <input className="mt-1 w-full border rounded px-2 py-2 font-mono" value={editing.draft.forwardPrimer || ''} onChange={e => setDraft('forwardPrimer', e.target.value)} /></label>
                                            <label className="block"><span className="font-semibold text-gray-700">Reverse name</span>
                                                <input className="mt-1 w-full border rounded px-2 py-2" value={editing.draft.reverseName || ''} onChange={e => setDraft('reverseName', e.target.value)} /></label>
                                            <label className="block col-span-2"><span className="font-semibold text-gray-700">Reverse primer</span>
                                                <input className="mt-1 w-full border rounded px-2 py-2 font-mono" value={editing.draft.reversePrimer || ''} onChange={e => setDraft('reversePrimer', e.target.value)} /></label>
                                        </div>
                                        <label className="block"><span className="font-semibold text-gray-700">Description</span>
                                            <input className="mt-1 w-full border rounded px-3 py-2" value={editing.draft.description || ''} onChange={e => setDraft('description', e.target.value)} /></label>
                                    </div>
                                )}
                                <div className="grid grid-cols-3 gap-3 mt-3 text-sm">
                                    {['freezer', 'shelf', 'box'].map(k => (
                                        <label key={k} className="block"><span className="font-semibold text-gray-700 capitalize">{k}</span>
                                            <input className="mt-1 w-full border rounded px-2 py-2" value={editing.draft[k] || ''} onChange={e => setDraft(k, e.target.value)} /></label>
                                    ))}
                                </div>
                                <div className="flex justify-end gap-2 mt-6">
                                    <button onClick={() => setEditing(null)} className="px-4 py-2 rounded-lg border border-gray-300 hover:bg-gray-50">Cancel</button>
                                    <button onClick={saveEdit} className="px-4 py-2 rounded-lg bg-indigo-600 text-white font-semibold hover:bg-indigo-700">Save</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Passcode Confirmation Modal */}
                    {showClearModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                            <div className="bg-white rounded-xl shadow-2xl p-8 max-w-sm w-full mx-4">
                                <div className="mb-6">
                                    <h3 className="text-2xl font-bold text-gray-900 mb-2">⚠️ Delete All Data</h3>
                                    <p className="text-gray-600">This action cannot be undone. All primers will be permanently deleted.</p>
                                    {shared && (
                                        <p className="text-red-600 font-semibold mt-2">These primers are shared with the lab. Deleting them here deletes them for everyone, not just on this computer.</p>
                                    )}
                                </div>

                                <div className="mb-6">
                                    <label className="block text-sm font-semibold text-gray-700 mb-3">Enter passcode to confirm:</label>
                                    <input
                                        type="password"
                                        value={clearPasscode}
                                        onChange={(e) => setClearPasscode(e.target.value)}
                                        onKeyPress={(e) => e.key === 'Enter' && confirmClearAll()}
                                        placeholder="Enter passcode"
                                        autoFocus
                                        className="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:border-red-500 outline-none transition font-mono text-center text-lg tracking-widest"
                                    />
                                    <p className="text-xs text-gray-500 mt-2">Passcode is case-insensitive</p>
                                </div>

                                <div className="flex gap-3">
                                    <button
                                        onClick={() => {
                                            setShowClearModal(false);
                                            setClearPasscode('');
                                        }}
                                        className="flex-1 px-4 py-3 border-2 border-gray-300 text-gray-700 font-bold rounded-lg hover:border-gray-400 transition"
                                    >
                                        Cancel
                                    </button>
                                    <button
                                        onClick={confirmClearAll}
                                        className="flex-1 px-4 py-3 bg-red-600 text-white font-bold rounded-lg hover:bg-red-700 transition"
                                    >
                                        Delete All
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PrimerGenerator />);
    </script>
</body>
</html>
